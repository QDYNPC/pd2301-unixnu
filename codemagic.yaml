workflows:
  pd2301-kernel:
    name: PD2301 kernel (macOS)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        LANG: en_US.UTF-8
        UNIXNU_REF: c96b29975645b711dc06bc435c3ad27321ce817c
    scripts:
      - name: Fetch UniXNU at the pinned revision
        script: |
          set -e
          rm -rf "$HOME/UniXNU"
          git clone -q https://github.com/UniXNU/UniXNU.git "$HOME/UniXNU"
          cd "$HOME/UniXNU"
          git fetch -q --depth 1 origin "$UNIXNU_REF"
          git checkout -q FETCH_HEAD
          echo "UniXNU at $(git rev-parse --short HEAD)"

      - name: Install build tools
        script: |
          set -uo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1
          needed=()
          for pair in "ninja:ninja" "cmake:cmake" "dtc:dtc" "lzfse:lzfse" "mtools:mcopy" "nasm:nasm" "acpica:iasl" "ccache:ccache"; do
            pkg="${pair%%:*}"; bin="${pair##*:}"
            command -v "$bin" >/dev/null 2>&1 || needed+=("$pkg")
          done
          if [ ${#needed[@]} -gt 0 ]; then
            echo "brew install: ${needed[*]}"
            brew install "${needed[@]}" || echo "some packages failed; continuing"
          fi

      - name: Install device profile and component recipe
        script: |
          set -e
          python3 "$CM_BUILD_DIR/scripts/install-unixnu-inputs.py" --unixnu "$HOME/UniXNU"

      - name: Fetch iPadOS firmware
        script: |
          set -e
          cd "$HOME/UniXNU"
          ./unixnu fetch -D "$CM_BUILD_DIR"
          ./unixnu ipsw info -D "$CM_BUILD_DIR" || true
          ok=0
          for i in 1 2 3 4; do
            if ./unixnu ipsw fetch -D "$CM_BUILD_DIR"; then ok=1; break; fi
            echo "ipsw fetch attempt $i failed; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then echo "ipsw fetch failed after 4 attempts"; exit 1; fi
          echo "== extracted members =="
          find out/ipsw -name 'kernelcache*' -type f 2>/dev/null | head -10 || true
          KC=$(find out/ipsw -name 'kernelcache*' -type f 2>/dev/null | head -1)
          if [ -n "$KC" ]; then
            DEST="$CM_BUILD_DIR/apple/ipados18-22H374/components/kernelcache.release.ipad7c.decompressed"
            mkdir -p "$DEST"
            cp "$KC" "$DEST/kernelcache.release.ipad7c.decompressed"
            echo "kernelcache -> $DEST ($(wc -c < "$KC") bytes)"
          else
            echo "no kernelcache found in out/ipsw"
          fi
          df -h /

      - name: Configure
        script: |
          set -e
          cd "$HOME/UniXNU"
          ./unixnu defconfig pong_ipados18_ci_defconfig -D "$CM_BUILD_DIR"

      - name: Build kernel
        script: |
          set +e
          export PONG_VOLUME_LAYOUT="$CM_BUILD_DIR/ci-inputs/volume-layout.json"
          cd "$HOME/UniXNU"
          ./unixnu build kernel -D "$CM_BUILD_DIR" -j6
          rc=$?
          echo "kernel build rc=$rc"
          COMPLOG=$(ls -t "$HOME"/UniXNU/out/pd2301/*/*/logs/component-PongPlatform24.log 2>/dev/null | head -1)
          if [ -f "$COMPLOG" ]; then
            echo "===== component log tail ====="
            tail -20 "$COMPLOG"
            echo "===== compile errors ====="
            grep -n "error:" "$COMPLOG" | head -40 || true
            echo "===== end ====="
          fi

          mkdir -p "$CM_BUILD_DIR/ci-logs"
          LOG=$(ls -t out/pd2301/*/*/build-*.log 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            cp "$LOG" "$CM_BUILD_DIR/ci-logs/kernel.log"
          else
            echo "no build log produced" > "$CM_BUILD_DIR/ci-logs/kernel.log"
          fi
          cd "$CM_BUILD_DIR"
          git config user.email ci@local
          git config user.name ci
          git add -f ci-logs/kernel.log
          git commit -qm "ci log rc=$rc" || true
          if [ -n "${GH_TOKEN:-}" ]; then
            git push -q --force "https://${GH_TOKEN}@github.com/QDYNPC/pd2301-unixnu.git" HEAD:refs/heads/ci-logs && echo "log pushed"
          else
            echo "GH_TOKEN unset; log not pushed"
          fi
          exit $rc

    artifacts:
      - "*.log"





