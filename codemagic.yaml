workflows:
  pd2301-kernel:
    name: PD2301 kernel (macOS)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        LANG: en_US.UTF-8
        UNIXNU_REF: c96b29975645b711dc06bc435c3ad27321ce817c
        # GH_TOKEN comes from Codemagic environment variables
    scripts:
      - name: Fetch UniXNU at the pinned revision
        script: |
          set -e
          rm -rf "$HOME/UniXNU"
          git clone -q https://github.com/UniXNU/UniXNU.git "$HOME/UniXNU"
          cd "$HOME/UniXNU"
          git fetch -q --depth 1 origin "$UNIXNU_REF"
          git checkout -q FETCH_HEAD
          echo "UniXNU at $(git rev-parse --short HEAD)"

      - name: Install build tools
        script: |
          set -uo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1
          needed=()
          for pair in "ninja:ninja" "cmake:cmake" "dtc:dtc" "lzfse:lzfse" "mtools:mcopy" "nasm:nasm" "acpica:iasl" "ccache:ccache"; do
            pkg="${pair%%:*}"; bin="${pair##*:}"
            command -v "$bin" >/dev/null 2>&1 || needed+=("$pkg")
          done
          if [ ${#needed[@]} -gt 0 ]; then
            echo "brew install: ${needed[*]}"
            brew install "${needed[@]}" || echo "some packages failed; continuing"
          fi
          for t in ninja cmake dtc lzfse mcopy nasm iasl ccache; do
            printf '%-8s ' "$t"; command -v "$t" || echo MISSING
          done

      - name: Install device profile and component recipe
        script: |
          set -e
          python3 "$CM_BUILD_DIR/scripts/install-unixnu-inputs.py" --unixnu "$HOME/UniXNU"

      - name: Configure
        script: |
          set -e
          cd "$HOME/UniXNU"
          ./unixnu defconfig zizhan_ipados18_gpu_defconfig -D "$CM_BUILD_DIR"

      - name: Build kernel
        script: |
          set +e
          cd "$HOME/UniXNU"
          ./unixnu build kernel -D "$CM_BUILD_DIR" -j6
          rc=$?
          echo "kernel build rc=$rc"

          # always publish the newest build log to the repo so it is readable from outside
          mkdir -p "$CM_BUILD_DIR/ci-logs"
          LOG=$(ls -t out/pd2301/*/*/build-*.log 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            cp "$LOG" "$CM_BUILD_DIR/ci-logs/kernel.log"
            echo "log: $LOG ($(wc -l < "$LOG") lines)"
          else
            echo "no build log produced" > "$CM_BUILD_DIR/ci-logs/kernel.log"
            ./unixnu build kernel -D "$CM_BUILD_DIR" -j6 > "$CM_BUILD_DIR/ci-logs/kernel.log" 2>&1
          fi

          cd "$CM_BUILD_DIR"
          git config user.email ci@local
          git config user.name ci
          git add -f ci-logs/kernel.log
          git commit -qm "ci log rc=$rc" || true
          git push -q --force "https://${GH_TOKEN}@github.com/QDYNPC/pd2301-unixnu.git" HEAD:refs/heads/ci-logs && echo "log pushed to ci-logs branch"
          exit $rc

    artifacts:
      - "*.log"
